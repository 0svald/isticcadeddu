<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<?!= include('Stile') ?>
<?!= include('Profilo') ?>
<?!= include('Aiuto') ?>
<?!= include('Listino') ?>
<style>
  .wrap{ max-width:760px; margin:0 auto; padding:16px 14px 130px; }
  .ccard .actions{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px; }
  .ccard .actions button{ width:100%; padding:0 6px; font-size:.95rem; }
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="mark" role="img" aria-label="GAS Isticcadeddu"></div><div class="bt"><b id="tit">GAS Isticcadeddu</b><small>Portale fornitore<span id="sub"></span></small></div></div></header>
<div class="wrap">
  <div id="loading" role="status" style="text-align:center"><div class="caricamento"><div class="gas-icon lg gira" aria-hidden="true"></div>Caricamento…</div></div>
  <div id="app" class="hidden">
    <section id="sez_home" class="hidden"><div id="home_box"></div></section>
    <section id="sez_notif" class="hidden">
      <h1>Notifiche</h1>
      <p class="muted" style="margin-top:0">Restano qui finché la cosa non cambia: un ordine verificato, un peso confermato, una consegna passata.</p>
      <div id="notif_box"></div>
    </section>
    <section id="sez_listino" class="hidden">
    <div class="sopra">Vendite</div>
    <div class="secbar"><h1 style="margin:0">Listino</h1><button onclick="Listino.nuovo()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Nuovo</button></div>
    <div id="riep_listino" class="riep"></div>
    <div id="listino"></div>
    </section>
    <section id="sez_raccolte" class="hidden">
      <div class="sopra">Vendite</div><h1 style="margin-top:2px">Raccolte</h1>
      <div id="riep_raccolte" class="riep"></div>
      <div id="cicli"></div>
    </section>
    <section id="sez_profilo" class="hidden"><div class="sopra">La mia tessera</div><div id="prof_box"></div></section>
    <section id="sez_aiuto" class="hidden"><div class="sopra">La mia tessera</div><div id="aiuto_box"></div></section>
  </div>
</div>
<nav class="barra-home" id="barra" aria-label="Menu"></nav>

<script>
  const TOKEN = "<?= token ?>";
  const SPIN='<span class="spin"></span>caricamento…';
  let DATI=null;
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function v(id){ const e=document.getElementById(id); return e?e.value:''; }
  function run(){ return google.script.run; }
  function nfmt(n){ return (Math.round((+n||0)*100)/100).toFixed(2).replace('.',','); }
  function err(e){ avvisa(e.message||String(e),'Qualcosa non è andato'); }

  run().withSuccessHandler(render).withFailureHandler(e=>{ document.getElementById('loading').textContent='Errore: '+e.message; }).fornitoreDati(TOKEN);

  function render(d){ DATI=d; document.getElementById('loading').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
    document.getElementById('tit').textContent=d.fornitore.nome;
    document.getElementById('sub').textContent=d.fornitore.zona?(' · '+d.fornitore.zona):'';
    renderCicli(); mostraListino(); renderRiepiloghi(); renderNotifiche();
    if(PRIMA_VOLTA){ PRIMA_VOLTA=false; vai('home'); } }
  let PRIMA_VOLTA=true;
  const SEZIONI=['home','notif','listino','raccolte','profilo','aiuto'];
  function plurale(n, uno, tanti){ return n+' '+(n===1?uno:tanti); }
  function inCorso(){ return (DATI.cicli||[]).filter(c=>!c.conclusa); }
  function renderRiepiloghi(){
    const ic=inCorso(), aperte=ic.filter(c=>c.stato==='aperto'), chiuse=ic.filter(c=>c.stato!=='aperto'&&c.stato!=='bozza');
    const nv=ic.reduce((a,c)=>a+(+c.nDaVerificare||0),0);
    const a0=aperte[0];
    GasUI.riep(document.getElementById('riep_raccolte'),
      ic.length?[aperte.length?plurale(aperte.length,'raccolta aperta','raccolte aperte'):'', chiuse.length?plurale(chiuse.length,'chiusa','chiuse'):''].filter(Boolean).join(' · '):'Nessuna raccolta in corso',
      [a0?('Aperta fino al '+a0.chiusura+' · '+plurale(a0.nValidi,'ordine','ordini')):'', nv?plurale(nv,'ordine da verificare','ordini da verificare'):''].filter(Boolean).join(' · '),
      { icona:'racc', evid:nv>0 });
    const pr=DATI.prodotti||[], nd=pr.filter(p=>!p.attivo).length;
    GasUI.riep(document.getElementById('riep_listino'), plurale(pr.length,'prodotto','prodotti')+(nd?(' · '+nd+' non disponibil'+(nd===1?'e':'i')):''),
      'Tocca "Disponibile" per togliere un prodotto finito.', { icona:'listino' });
  }
  // notifiche del fornitore: calcolate dai dati, restano finché l'evento non cambia stato
  function apriRaccolta(id, azione){ vai('raccolte'); if(azione) azione(id); const el=document.getElementById('det_'+id); if(el) el.closest('.card').scrollIntoView({behavior:'smooth',block:'start'}); }
  function notificheFornitore(){
    const ora=new Date(), oggi=new Date(ora.getFullYear(),ora.getMonth(),ora.getDate()), tra7=new Date(oggi.getTime()+8*864e5), l=[];
    inCorso().forEach(c=>{ const cons=c.dataConsegna?(' del '+c.dataConsegna):'';
      if(c.nDaVerificare) l.push({ tipo:'fare', icona:'attenz', titolo:plurale(c.nDaVerificare,'ordine da verificare','ordini da verificare'),
        testo:'Raccolta'+cons+': controlla e conferma o annulla.', azioni:[{testo:'Vedi gli ordini', fn:()=>apriRaccolta(c.id, ordiniF)}] });
      if(c.stato!=='aperto' && c.nPesiDaConfermare) l.push({ tipo:'fare', icona:'bilancia', titolo:'Conferma i pesi',
        testo:'Raccolta'+cons+': '+plurale(c.nPesiDaConfermare,'prodotto a peso','prodotti a peso')+' da confermare.', azioni:[{testo:'Conferma pesi', fn:()=>apriRaccolta(c.id, pesi)}] });
      const dch=GasUI.data(c.chiusura);
      if(c.stato==='aperto' && dch && dch>=ora && (dch-ora)<=24*3600*1000) l.push({ tipo:'info', icona:'orologio', titolo:'La raccolta chiude entro 24 ore',
        testo:'Ordini fino al '+c.chiusura+' · '+plurale(c.nValidi,'ordine','ordini')+' finora.', azioni:[{testo:'Riepilogo', fn:()=>apriRaccolta(c.id, riepilogo)}] });
      const dco=GasUI.data(c.dataConsegna);
      if(dco && dco>=oggi && dco<tra7) l.push({ tipo:'info', icona:'cons', titolo:'Consegna del '+c.dataConsegna,
        testo:plurale(c.nValidi,'ordine','ordini')+'.', azioni:[{testo:'Riepilogo', fn:()=>apriRaccolta(c.id, riepilogo)}] });
    });
    return l;
  }
  function renderNotifiche(){
    const note=notificheFornitore();
    GasUI.notifiche(document.getElementById('notif_box'), note);
    const nv=inCorso().reduce((a,c)=>a+(+c.nDaVerificare||0),0);
    GasUI.home(document.getElementById('home_box'), { nome:(String(DATI.fornitore.referente||'').trim().split(/\s+/)[0]||DATI.fornitore.nome), sotto:DATI.fornitore.nome, notifiche:note.length, vai:vai,
      gruppi:[ { titolo:'Vendite', voci:[{k:'raccolte',nome:'Raccolte',icona:'racc',n:nv},{k:'listino',nome:'Listino'}] },
               { titolo:'La mia tessera', voci:[{k:'profilo',nome:'Profilo'},{k:'aiuto',nome:'Aiuto'}] } ] });
  }

  function vai(k){ if(k==='profilo') Profilo.mostra(document.getElementById('prof_box'), TOKEN, 'fornitore'); if(k==='aiuto') Aiuto.mostra(document.getElementById('aiuto_box'), TOKEN, { profilo:'fornitore', pagina:'portale fornitore', sezione:'aiuto' });
    SEZIONI.forEach(x=>document.getElementById('sez_'+x).classList.toggle('hidden',x!==k));
    GasUI.barra(document.getElementById('barra'), k==='home', ()=>vai('home')); window.scrollTo({top:0}); }
  function chipStato(st){ const m={aperto:['Aperta',''],chiuso:['Chiusa',' grey'],definitivo:['Definitiva',' grey'],consegnato:['Consegnata',' grey'],archiviato:['Archiviata',' grey']}; const x=m[st]||[st,' grey']; return '<span class="badge'+x[1]+'">'+x[0]+'</span>'; }

  /* raccolte */
  // raccolte in corso in alto; quelle concluse (consegnate) in un riquadro chiuso in fondo, dalla più recente
  let CONCLUSE_APERTE=false;
  function cardCiclo(c){ const card=document.createElement('div'); card.className='card ccard'+(c.nDaVerificare?' mine':''); const badge=chipStato(c.stato)+(c.nDaVerificare?' <span class="badge warn">'+c.nDaVerificare+' da verificare</span>':'');
    let b='';
    // raccolta conclusa: ordini e riepilogo solo da vedere, niente "Conferma pesi"
    b+='<button class="sec" onclick="ordiniF(\''+c.id+'\')">Ordini</button><button class="sec" onclick="riepilogo(\''+c.id+'\')">Riepilogo</button>'+(c.conclusa?'':'<button class="sec" onclick="pesi(\''+c.id+'\')">Conferma pesi</button>');
    const chiudiB = c.stato==='aperto' ? '<button class="warn block" style="margin-top:8px" onclick="chiudi(\''+c.id+'\')">Chiudi gli ordini adesso</button>' : '';
    card.innerHTML='<div><b style="font-size:1.1rem">Raccolta'+(c.dataConsegna?(' – consegna '+c.dataConsegna):'')+'</b> '+badge+'<div class="muted">'+c.nValidi+' ordini'+(c.chiusura?(' · chiusura '+c.chiusura):'')+(c.dataConsegna?(' · consegna '+c.dataConsegna):'')+'</div></div><div class="actions">'+b+'</div>'+chiudiB+'<div id="det_'+c.id+'" style="margin-top:10px"></div>';
    return card; }
  function renderCicli(){ const box=document.getElementById('cicli'); box.innerHTML='';
    const inCorso=DATI.cicli.filter(c=>!c.conclusa), concluse=DATI.cicli.filter(c=>c.conclusa).sort((a,b)=>b.dt-a.dt);
    if(!inCorso.length) box.innerHTML='<div class="muted">Nessuna raccolta in corso.</div>';
    inCorso.forEach(c=>box.appendChild(cardCiclo(c)));
    if(!concluse.length) return;
    const det=document.createElement('details'); det.className='grp'; det.style.marginTop='18px'; det.open=CONCLUSE_APERTE;
    det.innerHTML='<summary style="min-height:48px;display:flex;align-items:center;cursor:pointer"><b>Raccolte concluse ('+concluse.length+')</b></summary><p class="muted" style="margin:6px 0 0">Le raccolte già consegnate, dalla più recente.</p>';
    det.addEventListener('toggle',()=>{ CONCLUSE_APERTE=det.open; });
    concluse.forEach(c=>det.appendChild(cardCiclo(c)));
    box.appendChild(det); }
  function chiudi(id){ chiedi('I soci non potranno più ordinare per questa raccolta.',{titolo:'Chiudere gli ordini?',ok:'Chiudi gli ordini',pericolo:true}).then(ok=>{ if(!ok)return; run().withSuccessHandler(()=>ricarica()).withFailureHandler(err).fornitoreChiudiCiclo(TOKEN,id); }); }
  function pesi(id){ const det=document.getElementById('det_'+id); det.innerHTML=SPIN; run().withSuccessHandler(l=>{ if(!l.length){ det.innerHTML='<div class="muted">Nessun prodotto a peso variabile.</div>'; return; } let h='<table><tr><th>Socio</th><th>Prodotto</th><th>Q.tà</th><th>Peso kg</th><th></th></tr>'; l.forEach(r=>{ h+='<tr><td>'+esc(r.nominativo)+'</td><td>'+esc(r.prodotto)+'</td><td>'+nfmt(r.quantita)+'</td><td><input id="pw_'+r.rigaId+'" style="width:80px" value="'+(r.pesoConfermato>0?nfmt(r.pesoConfermato):'')+'"></td><td><button class="mini" onclick="salvaPeso(\''+r.rigaId+'\')">Salva</button></td></tr>'; }); det.innerHTML=h+'</table>'; }).withFailureHandler(err).fornitoreRigheDaConfermare(TOKEN,id); }
  function salvaPeso(rid){ const val=v('pw_'+rid).replace(',','.'); run().withSuccessHandler(()=>{}).withFailureHandler(err).fornitoreConfermaPeso(TOKEN,rid,val); }
  function ordiniF(id){ const det=document.getElementById('det_'+id); det.innerHTML=SPIN;
    const sola=!!((DATI.cicli||[]).find(c=>c.id===id)||{}).conclusa; // raccolta conclusa: sola lettura
    run().withSuccessHandler(l=>{ if(!l.length){ det.innerHTML='<div class="muted">Nessun ordine.</div>'; return; }
      let h='<b>Ordini</b>';
      l.forEach(o=>{ const badge=o.stato==='valido'?'<span class="badge">valido</span>':'<span class="badge off">da verificare</span>';
        h+='<div class="card" style="margin-top:6px"><div><b>'+esc(o.tessera)+' — '+esc(o.nominativo)+'</b> '+badge+'</div>'+(o.telefono?'<div class="li2">'+esc(o.telefono)+'</div>':'')+(o.motivo?'<div class="li2">⚠️ '+esc(o.motivo)+'</div>':'')+(o.note?'<div class="li2">✎ nota: '+esc(o.note)+'</div>':'');
        o.righe.forEach(r=>{ h+='<div class="frow" style="margin:2px 0"><span style="flex:1;min-width:120px">'+esc(r.prodotto)+'</span>'+(sola?'<b style="flex:none">'+nfmt(r.quantita)+'</b>':'<input id="rqf_'+r.rigaId+'" value="'+nfmt(r.quantita)+'" style="width:64px;flex:none">')+'<span class="li2">'+esc(r.unita)+'</span>'+(sola?'':'<button class="sec mini" onclick="salvaRigaF(\''+r.rigaId+'\',\''+id+'\')">Salva</button>')+'</div>'; });
        h+=(sola?'':'<div class="edact">'+(o.stato!=='valido'?'<button class="mini" onclick="confOrdF(\''+o.id+'\',\''+id+'\')">Conferma</button>':'')+'<button class="warn mini" onclick="annOrdF(\''+o.id+'\',\''+id+'\')">Annulla ordine</button></div>')+'</div>';
      }); det.innerHTML=h;
    }).withFailureHandler(err).fornitoreOrdini(TOKEN,id); }
  function salvaRigaF(rid,cid){ run().withSuccessHandler(()=>ordiniF(cid)).withFailureHandler(err).fornitoreModificaRiga(TOKEN,rid,document.getElementById('rqf_'+rid).value.replace(',','.')); }
  function confOrdF(oid,cid){ run().withSuccessHandler(()=>ordiniF(cid)).withFailureHandler(err).fornitoreConfermaOrdine(TOKEN,oid); }
  function annOrdF(oid,cid){ chiediTesto('Scrivi il motivo, concordato con il socio:','Su richiesta del socio',{titolo:'Annullare l\'ordine?',ok:'Annulla l\'ordine'}).then(m=>{ if(m===null)return; run().withSuccessHandler(()=>ordiniF(cid)).withFailureHandler(err).fornitoreAnnullaOrdine(TOKEN,oid,m); }); }
  function riepilogo(id){ const det=document.getElementById('det_'+id); det.innerHTML=SPIN;
    run().withSuccessHandler(d=>{ if(!d.prodotti.length){ det.innerHTML='<div class="muted">Nessun ordine valido.</div>'; return; }
      let h='<table><tr><th>Prodotto</th><th>Quantità</th><th>Importo</th></tr>';
      d.prodotti.forEach(p=>{ h+='<tr><td>'+esc(p.nome)+'</td><td>'+nfmt(p.qta)+'</td><td>'+nfmt(p.importo)+' €</td></tr>'; });
      h+='<tr style="font-weight:700;background:#f1f8e9"><td>Totale ('+d.nOrdini+' ordini)</td><td></td><td>'+nfmt(d.totale)+' €</td></tr></table>';
      det.innerHTML=h;
    }).withFailureHandler(err).fornitoreRiepilogoRaccolta(TOKEN,id); }

  /* listino: lo stesso componente del pannello (Listino.html), con le funzioni del fornitore */
  const AZIONI_LISTINO={ listino:'fornitoreListino', salvaProdotto:'fornitoreSalvaProdotto', disponibile:'fornitoreToggleProdotto', eliminaProdotto:'fornitoreEliminaProdotto',
    opzioni:'fornitoreOpzioni', salvaOpzione:'fornitoreSalvaOpzione', eliminaOpzione:'fornitoreEliminaOpzione' };
  function mostraListino(){
    Listino.mostra(document.getElementById('listino'), {
      dati:{ categorie:DATI.categorie, prodotti:DATI.prodotti }, // già arrivati con fornitoreDati: niente seconda chiamata
      esegui:(azione,args)=>new Promise((ok,ko)=>{ const r=run().withSuccessHandler(ok).withFailureHandler(ko); r[AZIONI_LISTINO[azione]].apply(r,[TOKEN].concat(args)); }),
      dopo:(d)=>{ DATI.prodotti=d.prodotti; renderRiepiloghi(); }
    }); }

  function ricarica(){ run().withSuccessHandler(render).withFailureHandler(err).fornitoreDati(TOKEN); }
</script>
</body>
</html>
