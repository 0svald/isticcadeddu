<!-- Aiuto.html — sezione "Aiuto", uguale in tutte le pagine.
     Si include dopo lo stile con:  <?!= include('Aiuto') ?>
     Uso: Aiuto.mostra(contenitore, token, { profilo:'socio'|'fornitore'|'admin'|'form', pagina, sezione, raccoltaId }) -->
<style>
  .aiuto-tabs{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:6px 0 14px; }
  .aiuto-tabs button{ min-height:46px; padding:0 4px; font-size:.9rem; background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .aiuto-tabs button:hover{ background:var(--sub); }
  .aiuto-tabs button.on{ background:var(--green); color:var(--surface); border-color:var(--green); }
  .faq-gruppo{ font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:16px 2px 6px; }
  .faq details{ margin:0 0 8px; }
  .faq summary{ font-size:1.02rem; line-height:1.3; padding:6px 0; }
  .faq .risp{ padding:4px 0 10px; line-height:1.5; }
  .scelte{ display:flex; flex-direction:column; gap:8px; }
  .scelta{ display:flex; align-items:center; gap:10px; min-height:52px; padding:0 14px; border:1.5px solid var(--line); border-radius:var(--r); background:var(--surface); cursor:pointer; font-weight:700; }
  .scelta input{ width:22px; height:22px; accent-color:var(--green); }
  .scelta:has(input:checked){ border-color:var(--green); background:var(--green-bg); }
  .scelte.riga{ flex-direction:row; flex-wrap:wrap; } .scelte.riga .scelta{ flex:1 1 30%; min-width:110px; }
  .contatto{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-soft); }
  .contatto:last-child{ border-bottom:none; }
  .contatto .az{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .aiuto-field{ display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  .aiuto-field label, .aiuto-field .lab{ font-size:.9rem; font-weight:700; color:var(--muted); }
  .aiuto-field input, .aiuto-field textarea{ width:100%; }
</style>
<script>
  window.Aiuto = (function(){
    function e(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    const TITOLI={ socio:'Per i soci', fornitore:'Per i fornitori', admin:'Per gli amministratori' };
    let D=null, TOK='', CTX={}, BOX=null, SCHEDA='domande';

    function tabs(){
      const t=[['domande','Domande'],['segnala','Segnala'],['contatti','Contatti'],['guide','Guide']];
      return '<div class="aiuto-tabs" role="tablist">'+t.map(x=>'<button type="button" role="tab" aria-selected="'+(SCHEDA===x[0])+'" class="'+(SCHEDA===x[0]?'on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
    }
    function disegna(){
      let h='<h1>Aiuto</h1>'+tabs()+'<div id="aiuto_corpo"></div><p class="muted" style="margin-top:22px">Versione dell\'app: '+e(D.versione)+'</p>';
      BOX.innerHTML=h;
      BOX.querySelectorAll('.aiuto-tabs button').forEach(b=>b.onclick=()=>{ SCHEDA=b.dataset.t; disegna(); });
      const c=BOX.querySelector('#aiuto_corpo');
      if(SCHEDA==='domande') domande(c); else if(SCHEDA==='segnala') segnala(c); else if(SCHEDA==='contatti') contatti(c); else guide(c);
    }

    function domande(c){
      if(!D.faq.length){ c.innerHTML='<p class="muted">Non ci sono ancora domande frequenti.</p>'; return; }
      let h='<div class="faq">'; const ruoli=[...new Set(D.faq.map(f=>f.ruolo))];
      ruoli.forEach(r=>{ if(ruoli.length>1) h+='<div class="faq-gruppo">'+e(TITOLI[r]||r)+'</div>';
        D.faq.filter(f=>f.ruolo===r).forEach(f=>{ h+='<details><summary>'+e(f.domanda)+'</summary><div class="risp">'+e(f.risposta)+'</div></details>'; }); });
      h+='</div><p class="muted">Non trovi la risposta? Vai su <a href="#" data-vai="segnala">Segnala</a> o su <a href="#" data-vai="contatti">Contatti</a>.</p>';
      c.innerHTML=h; c.querySelectorAll('[data-vai]').forEach(a=>a.onclick=ev=>{ ev.preventDefault(); SCHEDA=a.dataset.vai; disegna(); });
    }

    function listaFornitori(){
      if(!D.fornitori.length) return '<p class="muted">Nessuna raccolta aperta in questo momento.</p>';
      return D.fornitori.map(f=>'<div class="contatto"><div><b>'+e(f.nome)+'</b><div class="muted">'+e([f.referente,f.telefono].filter(Boolean).join(' · '))+'</div></div><div class="az">'+
        (f.wa?'<a class="btnlink" target="_blank" rel="noopener" href="https://wa.me/'+e(f.wa)+'">WhatsApp</a>':'')+
        (f.telefono?'<a class="btnlink" href="tel:'+e(f.telefono.replace(/\s/g,''))+'">Chiama</a>':'')+'</div></div>').join('');
    }

    function segnala(c){
      let h='<div class="card warn"><div class="grpt">È un problema con il contenuto di un tuo ordine?<small>Per esempio una quantità sbagliata o un prodotto mancante.</small></div>'+
            '<p style="margin:0">Scrivi direttamente al fornitore: è il modo più veloce.</p>'+listaFornitori()+'</div>';
      h+='<div class="card"><div class="grpt">Segnala un problema dell\'app<small>La segnalazione arriva a tutti gli amministratori.</small></div>'+
         '<div class="aiuto-field"><span class="lab" id="lab_tipo">Cosa è successo?</span><div class="scelte" role="radiogroup" aria-labelledby="lab_tipo">'+
         D.tipi.map((t,i)=>'<label class="scelta"><input type="radio" name="ai_tipo" value="'+e(t.id)+'"'+(i===0?' checked':'')+'> '+e(t.nome)+'</label>').join('')+'</div></div>'+
         '<div class="aiuto-field"><label for="ai_descr">Descrivi il problema</label><textarea id="ai_descr" rows="4" maxlength="2000" placeholder="Cosa stavi facendo? Cosa ti aspettavi e cosa è successo?"></textarea></div>';
      if(D.anonimo) h+='<div class="aiuto-field"><label for="ai_nome">Nome e cognome</label><input id="ai_nome" type="text" autocomplete="name"></div>'+
         '<div class="aiuto-field"><label for="ai_tess">Numero tessera</label><input id="ai_tess" type="text" inputmode="numeric"></div>'+
         '<div class="aiuto-field"><label for="ai_rec">Telefono o email per ricontattarti</label><input id="ai_rec" type="text" autocomplete="tel"></div>';
      h+='<div class="aiuto-field"><span class="lab" id="lab_cont">Come preferisci essere ricontattato?</span><div class="scelte riga" role="radiogroup" aria-labelledby="lab_cont">'+
         [['whatsapp','WhatsApp'],['telefono','Telefono'],['email','Email']].map((x,i)=>'<label class="scelta"><input type="radio" name="ai_cont" value="'+x[0]+'"'+(i===0?' checked':'')+'> '+x[1]+'</label>').join('')+'</div></div>'+
         '<p class="muted">Insieme al messaggio inviamo la pagina in cui ti trovi, il tipo di telefono e l\'ultimo messaggio di errore mostrato: servono a capire il problema.</p>'+
         '<div class="edact"><button id="ai_invia" class="block">Invia la segnalazione</button></div></div>';
      c.innerHTML=h;
      c.querySelector('#ai_invia').onclick=()=>invia(c);
    }
    function invia(c){
      const val=s=>{ const x=c.querySelector(s); return x?x.value:''; };
      const d={ tipo:(c.querySelector('input[name=ai_tipo]:checked')||{}).value, descrizione:val('#ai_descr'),
        contatto:(c.querySelector('input[name=ai_cont]:checked')||{}).value, nome:val('#ai_nome'), tessera:val('#ai_tess'), recapito:val('#ai_rec'),
        tecnico:{ profilo:CTX.profilo||'', pagina:CTX.pagina||'', sezione:CTX.sezione||'', raccoltaId:CTX.raccoltaId||'',
          dispositivo:navigator.userAgent, schermo:(window.innerWidth+'x'+window.innerHeight), ultimoErrore:(window.__ultimoErrore||'') } };
      if(String(d.descrizione).trim().length<5){ avvisa('Scrivi qualche parola per spiegare il problema.'); return; }
      if(D.anonimo && !String(d.recapito).trim()){ avvisa('Lasciaci un telefono o un\'email per poterti ricontattare.'); return; }
      const b=c.querySelector('#ai_invia'); b.disabled=true; b.textContent='Invio…';
      google.script.run.withSuccessHandler(()=>{
        c.innerHTML='<div class="card" style="text-align:center"><div class="gas-icon lg" aria-hidden="true"></div><h2>Grazie!</h2><p>La segnalazione è arrivata agli amministratori. Se servono altri dettagli, ti ricontatteranno.</p></div>';
      }).withFailureHandler(err=>{ b.disabled=false; b.textContent='Invia la segnalazione'; avvisa(err.message||String(err),'Non inviata'); })
        .aiutoSegnala(TOK,d);
    }

    function contatti(c){
      let h='<div class="card"><div class="grpt">Referenti del comitato</div>';
      if(!D.referenti.length) h+='<p class="muted" style="margin:0">I referenti sono in via di definizione. Nel frattempo puoi usare "Segnala": la segnalazione arriva a tutti gli amministratori.</p>';
      else h+=D.referenti.map(r=>'<div class="contatto"><div><b>'+e(r.nome)+'</b><div class="muted">'+e(r.argomento)+'</div></div><div class="az">'+
        (r.wa?'<a class="btnlink" target="_blank" rel="noopener" href="https://wa.me/'+e(r.wa)+'">WhatsApp</a>':'')+
        (r.telefono?'<a class="btnlink" href="tel:'+e(r.telefono.replace(/\s/g,''))+'">Chiama</a>':'')+
        (r.email?'<a class="btnlink" href="mailto:'+e(r.email)+'">Email</a>':'')+'</div></div>').join('');
      h+='</div><div class="card"><div class="grpt">Fornitori delle raccolte aperte<small>Per domande su prodotti, pesi e consegne.</small></div>'+listaFornitori()+'</div>';
      c.innerHTML=h;
    }

    function guide(c){
      let h='<div class="card"><div class="grpt">Guide da scaricare<small>Trovi le guide dei tuoi profili.</small></div>';
      D.guide.forEach(g=>{ h+='<div class="contatto"><div><b>'+e(g.titolo)+'</b><div class="muted">PDF</div></div><div class="az">'+
        (g.disponibile?'<button class="sec mini" data-g="'+e(g.ruolo)+'">Scarica</button>':'<span class="muted">presto disponibile</span>')+'</div></div>'; });
      c.innerHTML=h+'</div>';
      c.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ b.disabled=true; b.textContent='…';
        google.script.run.withSuccessHandler(r=>{ b.disabled=false; b.textContent='Scarica';
          const bytes=Uint8Array.from(atob(r.base64),ch=>ch.charCodeAt(0)); const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
          const a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
        }).withFailureHandler(err=>{ b.disabled=false; b.textContent='Scarica'; avvisa(err.message||String(err),'Non scaricata'); }).aiutoGuida(TOK,b.dataset.g); });
    }

    return {
      mostra: function(box, token, ctx){
        BOX=box; TOK=token||''; CTX=ctx||{}; SCHEDA='domande';
        box.innerHTML='<div class="caricamento mini" role="status"><div class="gas-icon gira" aria-hidden="true"></div>Caricamento…</div>';
        google.script.run.withSuccessHandler(d=>{ D=d; disegna(); })
          .withFailureHandler(err=>{ box.innerHTML='<div class="notice err">'+e(err.message||String(err))+'</div>'; })
          .aiutoDati(TOK, { raccoltaId: CTX.raccoltaId||'' });
      }
    };
  })();
</script>
